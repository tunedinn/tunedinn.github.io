<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/jpeg" href="{{ '/assets/img/tunedinn-bot.jpg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision | default: site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="brand-avatar" src="{{ '/assets/img/tunedinn-bot.jpg' | relative_url }}" alt="TunedInn Robot Mascot" width="36" height="36">
        <span class="brand-name">Tuned<strong>Inn</strong></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/guides/' | relative_url }}">Guides</a>
        <a href="https://github.com/tunedinn/intune-remediations" target="_blank" rel="noopener">Remediations</a>
        <a href="https://github.com/tunedinn/intune-scripts" target="_blank" rel="noopener">Scripts</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img class="footer-avatar" src="{{ '/assets/img/tunedinn-bot.jpg' | relative_url }}" alt="" width="28" height="28" aria-hidden="true">
        <p><strong>TunedInn</strong> — Cozy workshop for Intune, Autopilot &amp; PowerShell resources.</p>
      </div>
      <div class="footer-links">
        <a href="https://github.com/tunedinn" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ '/guides/' | relative_url }}">All Guides</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </div>
    </div>
  </footer>
</body>
</html>
